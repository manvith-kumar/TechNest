spring:
  application:
    name: technest
  config:
    # Optional local .env file (key=value). Copy .env.example to .env. Never commit .env.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:technest_db}?serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:technest}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # schema is owned by Flyway migrations (../database/migrations)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

technest:
  jwt:
    secret: ${JWT_SECRET}                      # required, >= 32 bytes, see .env.example
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
    cookie-secure: ${COOKIE_SECURE:false}      # set true when served over HTTPS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  shipping:
    free-threshold: ${SHIPPING_FREE_THRESHOLD:5000}
    flat-fee: ${SHIPPING_FLAT_FEE:99}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    log-reset-links: ${LOG_RESET_LINKS:false}  # DEV ONLY: no mail server, so the reset link is written to the log
    max-failed-logins: 5
    lockout-minutes: 15

logging:
  level:
    com.technest: INFO
